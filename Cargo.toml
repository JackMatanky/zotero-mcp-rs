[package]
name = "zotero-mcp-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
description = "Model Context Protocol server for Zotero"
repository = "https://github.com/jack/zotero-mcp-rs"

[dependencies]
rmcp = { version = "0.8.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
pdf-extract = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1.0"
async-trait = "0.1"
url = "2.5"
urlencoding = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
