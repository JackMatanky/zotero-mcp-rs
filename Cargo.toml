[workspace]
resolver = "2"
members = ["crates/zotero-api", "crates/zotero-cli", "crates/zotero-mcp"]

[workspace.package]
edition = "2021"
rust-version = "1.94"
repository = "https://github.com/jack/zotero-mcp-rs"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fastembed = { version = "5.17.4", default-features = false, features = [
  "hf-hub-native-tls",
  "ort-load-dynamic",
] }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
md-5 = "0.11"
pdf-extract = "0.7"
pretty_assertions = "1"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
urlencoding = "2.1"
zotero-api = { path = "crates/zotero-api" }

[workspace.lints.clippy]
absolute_paths = "allow"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "warn"
as_pointer_underscore = "deny"
as_underscore = "deny"
cargo = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
dbg_macro = "deny"
disallowed_methods = "deny"
else_if_without_else = "warn"
exit = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
format_push_string = "warn"
impl_trait_in_params = "warn"
implicit_return = "allow"
indexing_slicing = "deny"
large_types_passed_by_value = "deny"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "deny"
missing_inline_in_public_items = "warn"
missing_panics_doc = "deny"
mod_module_files = "allow"
multiple_crate_versions = "allow"
panic = "deny"
panic_in_result_fn = "deny"
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = "allow"
print_stdout = "deny"
pub_with_shorthand = "allow"
question_mark_used = "allow"
semicolon_inside_block = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "deny"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "deny"
struct_excessive_bools = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unseparated_literal_suffix = "allow"
unused_self = "deny"
unwrap_used = "deny"
