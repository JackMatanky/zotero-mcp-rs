[package]
name = "zotero-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Protocol-agnostic domain library for the Zotero Local API, Better BibTeX, Better Notes, and local semantic search"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords = ["bibliography", "bibtex", "zotero"]
categories = ["api-bindings"]

[dependencies]
fastembed.workspace = true
lopdf.workspace = true
md-5.workspace = true
pdf-extract.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[features]
# Exposes test-only fixture helpers (mock HTTP/SQLite builders, AppState/
# SecurityConfig test constructors, synthetic PDF writers) as `pub` so
# zotero-mcp's own test suite can build fixtures against this crate without
# those helpers being part of the normal public API. Never enabled outside
# `cfg(test)` or a dev-dependency declaration.
test-util = []

[lints]
workspace = true
