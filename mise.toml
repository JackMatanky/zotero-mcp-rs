# -----------------------------------------------------------------------------
# Filename:    mise.toml
# Docs:        https://mise.jdx.dev/
# Description: Project-wide tool versioning and task orchestration
# -----------------------------------------------------------------------------
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi schema.strict = false

[tools]
rust = { version = "nightly", profile = "default", components = [
  "rust-src",
  "rustfmt",
] }
node = "22"
hk = "latest"
taplo = "latest"
gitleaks = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:critcmp" = "latest"
"cargo:cargo-sweep" = "latest"
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }
"cargo:adrs" = { version = "latest", install_env = { RUSTUP_TOOLCHAIN = "nightly" } }

[tools."http:onnxruntime"]
version = "1.28.0"
bin = "lib/libonnxruntime.dylib"

[tools."http:onnxruntime".platforms.macos-arm64]
url = "https://github.com/microsoft/onnxruntime/releases/download/v{{version}}/onnxruntime-osx-arm64-{{version}}.tgz"

[tools."http:onnxruntime".platforms.linux-x64]
url = "https://github.com/microsoft/onnxruntime/releases/download/v{{version}}/onnxruntime-linux-x64-{{version}}.tgz"
bin = "lib/libonnxruntime.so"

[tools."http:onnxruntime".platforms.linux-arm64]
url = "https://github.com/microsoft/onnxruntime/releases/download/v{{version}}/onnxruntime-linux-aarch64-{{version}}.tgz"
bin = "lib/libonnxruntime.so"

[env]
HK_MISE = "1"
RUST_BACKTRACE = "1"
ADR_DIRECTORY = "docs/adr/"
ORT_DYLIB_PATH = "{{env.HOME}}/.local/share/mise/installs/http-onnxruntime/1.28.0/lib/libonnxruntime.dylib"

[tasks.check]
description = "Fast compilation check"
run = "cargo check --workspace"
alias = "c"

[tasks.build]
description = "Debug build"
run = "cargo build"
alias = "b"

[tasks.run]
description = "Run the MCP server"
run = "cargo run -p zotero-mcp"

[tasks.test]
description = "Run tests with nextest"
run = "cargo nextest run"
depends = ["check"]
alias = "t"

[tasks."test-all"]
description = "Run all tests including doc-tests"
run = "cargo test --all-features"

[tasks."test-ort-smoke"]
description = "Real ONNX inference smoke test: downloads the BGE-small model (~130MB from Hugging Face) on first run and runs genuine embedding inference. Not part of default test runs (test/test-all skip #[ignore]'d tests)."
run = "cargo test --test ort_smoke -- --ignored --nocapture"

[tasks.lint]
description = "Run all hk linters"
run = "hk check"

[tasks.fix]
description = "Auto-fix all hk lint issues"
run = "hk fix"

[tasks.fmt]
description = "Format all Rust code (nightly)"
run = "cargo fmt --all"

[tasks."fmt-check"]
description = "Check formatting without modifying files (CI-safe; use this instead of `fmt` when you only want a pass/fail signal)"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy across all targets & features with warnings denied - this is the project's actual lint bar; `--workspace` alone misses tests/ (e.g. tests/ort_smoke.rs)"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.doc]
description = "Build documentation"
run = "cargo doc --no-deps"

[tasks.audit]
description = "Run cargo deny audit"
run = "cargo deny check"

[tasks."boundary-check"]
description = "Fail if rmcp/schemars leak into zotero-api's dependency tree - it must stay a protocol-agnostic domain library"
run = '''
if cargo tree -p zotero-api -e normal --prefix none | grep -qE '^(rmcp|schemars) '; then
  echo "zotero-api must stay protocol-agnostic: rmcp/schemars leaked into its dependency tree" >&2
  exit 1
fi
'''

[tasks.verify]
description = "Full pre-commit verification: fmt-check + clippy (all targets/features, deny warnings) + full test suite incl. doctests + domain/protocol boundary check. Run this before yielding non-trivial changes instead of chaining raw cargo commands."
depends = ["fmt-check", "clippy", "test-all", "boundary-check"]

[tasks.ci]
description = "Full CI pipeline (verify + supply-chain audit)"
depends = ["verify", "audit"]

[tasks.coverage]
description = "Code coverage with tarpaulin"
run = "cargo tarpaulin --workspace --out html"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.sweep]
description = "Prune target/ artifacts untouched for 14+ days (e.g. after a crate/package rename orphans target/debug/build/<old-name>-*/ and target/debug/deps/<old_name>-*; cargo never garbage-collects these on its own). Cheaper than `clean` - keeps recent fingerprints so the next build stays incremental."
run = "cargo sweep --time 14"

[tasks.watch]
description = "Watch and auto-check on changes"
run = "cargo watch -x check -x test"

[tasks.setup]
description = "Install git hooks via hk"
run = "hk install --mise"

[tasks.release]
description = "Release build"
run = "cargo build --release"
alias = "r"

[tasks."bridge:install"]
description = "Install the Better Notes bridge's npm dependencies"
dir = "bridge"
run = "npm install"

[tasks."bridge:typecheck"]
description = "Type-check the Better Notes bridge without emitting"
dir = "bridge"
depends = ["bridge:install"]
run = "npx tsc -p tsconfig.json --noEmit"

[tasks."bridge:build"]
description = "Compile the Better Notes bridge to zotero-better-notes-bridge.js"
dir = "bridge"
depends = ["bridge:install"]
run = "npm run build"

[hooks]
postinstall = "hk install --mise"
