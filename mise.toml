[tools]
rust = { version = "nightly", components = ["rust-src", "rustfmt"] }
node = "22"
hk = "1.53.0"
"cargo:https://github.com/snowmead/rust-docs-mcp" = { version = "branch:main", crate = "rust-docs-mcp" }

[env]
RUST_BACKTRACE = "1"

[tasks.build]
description = "Compile the crate"
run = "cargo build"

[tasks.run]
description = "Run the server"
run = "cargo run"

[tasks.test]
description = "Run tests"
run = "cargo test --all-features"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks.lint]
description = "Lint with clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.check]
description = "Run all CI checks"
depends = ["bridge:typecheck"]
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo test --all-features",
]

[tasks."bridge:install"]
description = "Install the Better Notes bridge's npm dependencies"
dir = "bridge"
run = "npm install"

[tasks."bridge:typecheck"]
description = "Type-check the Better Notes bridge without emitting"
dir = "bridge"
depends = ["bridge:install"]
run = "npx tsc -p tsconfig.json --noEmit"

[tasks."bridge:build"]
description = "Compile the Better Notes bridge to zotero-better-notes-bridge.js"
dir = "bridge"
depends = ["bridge:install"]
run = "npm run build"
